<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Trailer Folk HQ</title>
<meta name="theme-color" content="#0e0a01">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">   <!-- opaque status bar: iPadOS's translucent glass over the top edge was smearing the header -->
<meta name="apple-mobile-web-app-title" content="TF HQ">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Open+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Press-kit look: dark umber ground, Trailer Folk gold, wide heavy display caps
   with an outlined echo, B&W photography, gold-gradient name plates. */
:root{
  --ink-0:#0e0a01;            /* deepest ground */
  --ink-1:#170f02;            /* page */
  --ink-2:#22180a;            /* raised */
  --ink-3:#2e2310;            /* hover / inputs */
  --line:rgba(255,191,67,.16);
  --line-soft:rgba(243,238,228,.08);
  --gold:#ffbf43;
  --gold-deep:#c98a12;
  --cream:#f3eee4;
  --muted:#a89f8c;
  --faint:#6f6756;
  --ok:#7fc79a;
  --warn:#ffbf43;
  --bad:#ff7a5c;
  --info:#8fb8e8;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
/* app shell: header and tab bar never move; only .scroll scrolls (stops iOS toolbar collapse from shifting the footer) */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{
  background:radial-gradient(120% 80% at 85% 0%, #2c1d03 0%, var(--ink-1) 45%, var(--ink-0) 100%) fixed var(--ink-0);
  color:var(--cream);font:14px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- display type ---------- */
.disp{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.echo{position:relative;display:inline-block;margin:0 0 .9em}
.echo .solid{color:var(--gold);display:block}
.echo .ghost{display:block;color:transparent;-webkit-text-stroke:1.2px rgba(243,238,228,.55);margin-top:.06em}
h1.echo{font-size:clamp(28px,4.4vw,46px)}
h2.sec{font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;color:var(--gold);font-size:15px;letter-spacing:.04em;margin:0 0 12px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- top bar (press kit nav) ---------- */
.top{position:relative;flex:none;z-index:20;display:flex;align-items:stretch;justify-content:space-between;gap:12px;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  padding-top:calc(max(env(safe-area-inset-top, 0px), 20px) + 18px);
  background:#0e0a01;-webkit-backdrop-filter:none;backdrop-filter:none;isolation:isolate;border-bottom:1px solid var(--line-soft)}   /* solid, like the status-bar strip and the footer: nothing scrolls under it any more, so no see-through haze */
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;padding:8px 0 6px}
.brand img{height:50px;width:auto;display:block;overflow:visible;image-rendering:-webkit-optimize-contrast;opacity:1;filter:none}
.brand span{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;align-items:stretch;background:rgba(243,238,228,.05);margin-right:-16px}
.nav a{display:flex;align-items:center;padding:0 16px;color:var(--cream);text-decoration:none;font-size:14px;opacity:.82;border-bottom:2px solid transparent}
.nav a:hover{opacity:1}
.nav a.on{color:var(--gold);opacity:1;font-weight:700;border-bottom-color:var(--gold)}
.who{display:flex;align-items:center;gap:8px;padding-left:12px}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover;filter:grayscale(1);border:1px solid var(--line)}
/* the tab bar is the only navigation, at every screen size, in Safari and in the Home Screen app */
.nav{display:none}
.tabbar{display:flex;justify-content:center;position:fixed;left:0;right:0;bottom:-12px;z-index:30;background:#0e0a01;border-top:1px solid var(--line-soft);
  padding:4px max(6px,env(safe-area-inset-right)) 14px max(6px,env(safe-area-inset-left))}
.tabbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:90px;background:#0e0a01}   /* nothing from the page shows beneath the bar */
.tabbar a{flex:1 1 0;min-width:0;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:8px 0 0;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600;line-height:1}
.tabbar a svg{width:22px;height:22px;display:block;flex:none}
.tabbar a.on{color:var(--gold)}
.sa-top{position:fixed;inset:0 0 auto;height:max(env(safe-area-inset-top,0px),8px);background:#0e0a01;z-index:25}   /* solid strip at the very top: also what Safari samples to tint its own bar */

main{max-width:1240px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}

/* ---------- surfaces ---------- */
.panel{background:linear-gradient(180deg,rgba(243,238,228,.045),rgba(243,238,228,.02));border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.stack>*+*{margin-top:12px}

/* name plate — the gold gradient bar from the team page */
.plate{background:linear-gradient(90deg,var(--gold) 0%,#e9a52a 45%,#3a2805 100%);color:#140e02;border-radius:4px;padding:8px 12px;font-weight:700}
.plate small{display:block;font-weight:600;opacity:.75;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(243,238,228,.04);color:var(--cream);
  padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);color:#140e02;border-color:var(--gold)}
.btn.gold:hover{background:#ffd27a;color:#140e02}
.btn.ghost{background:transparent;border-color:transparent;padding:6px 10px}
.btn.danger{border-color:rgba(255,122,92,.5);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-soft);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,191,67,.08)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
.in,select.in,textarea.in{width:100%;background:var(--ink-0);border:1px solid rgba(243,238,228,.14);border-radius:8px;padding:9px 11px;color:var(--cream);font-size:14px;text-transform:none;letter-spacing:0;font-weight:400}
.in:focus{border-color:var(--gold);outline:none}
textarea.in{min-height:76px;resize:vertical}
/* iOS Safari gives date/time inputs a fixed intrinsic width that spills into the next column */
input.in[type=date],input.in[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:40px;line-height:1.2}
input.in::-webkit-date-and-time-value{text-align:left;margin:0}
input.in::-webkit-datetime-edit{padding:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--cream);cursor:pointer}
.check input{accent-color:var(--gold);width:16px;height:16px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid .w2{grid-column:span 2}.fgrid .w4{grid-column:1/-1}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.st-inquiry{color:var(--info)} .st-quoted{color:#c9a7ff} .st-confirmed{color:var(--gold)}
.st-complete{color:var(--ok)} .st-passed,.st-cancelled{color:var(--faint)} .st-practice{color:var(--muted)}
.sev{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.sev.hi{background:var(--bad)} .sev.md{background:var(--gold)} .sev.lo{background:var(--muted)}

/* ---------- KPI ---------- */
.kpi .v{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:28px;color:var(--cream);line-height:1.1}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:11px 4px;border-top:1px solid var(--line-soft);text-decoration:none;color:inherit;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:rgba(255,191,67,.04)}
.date{width:52px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;line-height:1.05}
.date b{display:block;font-family:var(--display);font-stretch:112%;font-size:20px;font-weight:800;color:var(--gold)}
.date small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.li .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th[data-sort]{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:rgba(255,191,67,.04)}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}

/* ---------- next-up hero ---------- */
.next{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);min-height:220px;display:flex;align-items:flex-end;padding:22px}
.next::before{content:"";position:absolute;inset:0;background:url(assets/hero.jpg) center 78%/cover;filter:grayscale(1) contrast(1.05);opacity:.42}
.next::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,10,1,.95) 0%,rgba(14,10,1,.7) 55%,rgba(14,10,1,.25) 100%)}
.next>*{position:relative;z-index:1}
.next .when{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(30px,5vw,54px);color:var(--gold);line-height:.95;text-transform:uppercase}
.next .what{font-size:20px;font-weight:700;margin-top:8px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.cal .day{min-height:92px;border:1px solid var(--line-soft);border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px;background:rgba(243,238,228,.015)}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--gold)}
.cal .dn{font-size:11px;color:var(--muted);font-weight:700}
.cal .ev{font-size:11px;line-height:1.25;padding:3px 5px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid currentColor;background:rgba(243,238,228,.06)}
.cal .ev.gig{color:var(--gold)} .cal .ev.practice{color:var(--muted)} .cal .ev.lead{color:var(--info)} .cal .ev.dead{color:var(--faint);text-decoration:line-through}
.cal .ev span{color:var(--cream)}

/* ---------- setlist ---------- */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.set h3{margin:0;font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;color:var(--gold);font-size:14px;letter-spacing:.04em}
.set.sel{border-color:var(--gold)}
.song{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line-soft)}
.song .n{color:var(--faint);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.song .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .meta{font-size:11.5px;color:var(--muted)}
.song.unplayed .nm{text-decoration:line-through;color:var(--faint)}
.song .acts{display:flex;gap:2px;opacity:.55}
.song:hover .acts{opacity:1}
.ib{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px;font-size:13px;line-height:1}
.ib:hover{color:var(--gold);background:rgba(255,191,67,.08)}
.bar{height:6px;border-radius:3px;background:rgba(243,238,228,.08);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.over{background:var(--bad)}
.lib{max-height:70vh;overflow:auto}
.libi{display:flex;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line-soft);cursor:pointer}
.libi:hover{background:rgba(255,191,67,.05)}
.libi.used{opacity:.4}
.plangrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:12px;align-items:end}
.plan-acts{flex-wrap:nowrap}

/* ---------- stars ---------- */
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:transparent;padding:0 1px;cursor:pointer;color:rgba(243,238,228,.22);font-size:15px;line-height:1}
.stars button.on{color:var(--gold)}
.stars.ro button{cursor:default}

/* ---------- team photos ---------- */
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mate{display:flex;flex-direction:column}
.mate img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(1);border-radius:4px 4px 0 0;display:block}
.mate .plate{border-radius:0 0 4px 4px;text-align:center}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,3,0,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px;overflow:auto}
.modal{width:min(760px,100%);background:var(--ink-1);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#140e02;font-weight:700;padding:10px 18px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--bad);color:#fff}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--bad)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .ph{background:url(assets/hero.jpg) center/cover;filter:grayscale(1);min-height:240px;position:relative}
.login .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--ink-1))}
.login .fm{display:flex;flex-direction:column;justify-content:center;padding:40px max(24px,env(safe-area-inset-right)) 40px 24px;max-width:480px}
.login .fm img{width:120px;margin-bottom:18px}

.fold{padding:0}
.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2.sec{margin:0}
.fold>summary .sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.fold>summary .chev{color:var(--muted);transition:transform .15s;font-size:12px}
.fold[open]>summary .chev{transform:rotate(180deg)}
.fold[open]>summary .sum{visibility:hidden}
.fold>summary:hover h2.sec{text-decoration:underline;text-underline-offset:4px}
.fold-body{padding:0 18px 18px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mail pre{white-space:pre-wrap;background:var(--ink-0);border:1px solid var(--line-soft);border-radius:8px;padding:12px;font:13px/1.5 var(--body);margin:8px 0}

/* iOS zooms into any field under 16px — keep fields at 16px on phones */
@media (max-width:980px), (pointer:coarse){ .in,select.in,textarea.in,input,select,textarea{font-size:16px!important} }
@media (max-width:980px){
  .who .nm{display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:minmax(0,1fr)}
  .plangrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plangrid .plan-acts{grid-column:1/-1}
  .team{grid-template-columns:repeat(3,minmax(0,1fr))}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .ph::after{background:linear-gradient(180deg,transparent 40%,var(--ink-1))}
  .login .fm::after{content:"";display:block;height:55vh}   /* room to scroll so the keyboard never covers the fields */
}
@media (max-width:620px){
  main{padding-top:18px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plangrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plangrid .plan-acts{grid-column:1/-1}
  .cal .day{min-height:58px;padding:3px}
  .cal .ev{font-size:0;padding:0;height:6px;border-left:0;background:currentColor}
  .brand img{height:44px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
/* ---------- key/value facts (gig & setlist view mode) ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px 20px}
.kv .v{font-size:17px;font-weight:600;margin-top:2px}
.chk{display:flex;flex-direction:column}
.chk .check{padding:11px 4px;border-top:1px solid var(--line-soft);font-size:14px}
.chk .check:first-child{border-top:0}
.chk .check input{width:20px;height:20px;flex:none}
.cal.compact .day{min-height:64px}
.cal-month{font-family:var(--display);font-stretch:112%;font-weight:800;color:var(--gold);font-size:17px;margin:18px 0 8px}
.cal-month:first-child{margin-top:0}

/* ---------- colorblind mode: blue/orange instead of green/red, plus shapes ---------- */
body.cb{--ok:#4da3ff;--bad:#ff7a2f;--info:#a9c4e0}
body.cb .st-quoted{color:#f0a6d3}
body.cb .sev{border-radius:0}
body.cb .sev.hi{width:11px;height:11px;margin-top:5px;clip-path:polygon(50% 0,100% 100%,0 100%)}
body.cb .sev.md{width:8px;height:8px;margin-top:6px;transform:rotate(45deg)}
body.cb .sev.lo{border-radius:50%}
body.cb .bar i.over{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,#ffd9bd 4px 8px)}
body.cb .toast.err{background:var(--bad);color:#140e02}
/* ---------- back button, photos, setlist notes, section heading ---------- */
a.back{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:var(--cream);text-decoration:none;padding:9px 16px 9px 12px;border-radius:999px;background:rgba(243,238,228,.07);border:1px solid var(--line)}
a.back:active{background:rgba(243,238,228,.14)}
.sec2{font-family:var(--display);font-stretch:112%;font-weight:800;color:var(--gold);font-size:clamp(22px,3.4vw,32px);margin:30px 0 14px;line-height:1.1}
.up-scroll{max-height:400px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-right:-6px;padding-right:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.photos .ph{position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:rgba(243,238,228,.05);cursor:zoom-in;display:block}
.photos .ph .ib{position:absolute;top:6px;right:6px;background:rgba(10,7,1,.8)}
.lightbox{max-width:100%;max-height:92vh;border-radius:12px;margin:auto;display:block}
.snote{margin:2px 0 6px 30px;padding:5px 10px;border-left:2px solid var(--gold);color:var(--cream);font-style:italic;font-size:13px;line-height:1.35}
.snote-edit{margin:0 0 8px 30px}
.snote-edit .in{font-size:13px;padding:7px 10px}
.tbl th[data-act]{cursor:pointer;user-select:none}
/* ---------- gig mode ---------- */
#gigMode{position:fixed;inset:0;z-index:90;background:#0a0702;display:flex;flex-direction:column;color:var(--cream)}
.gm-top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#14100a;border-bottom:1px solid var(--line-soft)}
.gm-title{flex:1;min-width:0}.gm-t1{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gm-t2{font-size:12px;color:var(--muted)}
.gm-btn{min-width:46px;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:rgba(243,238,228,.08);color:var(--cream);font-size:16px;font-weight:700;font-family:inherit}
.gm-awake{background:none;border:0;font-size:12px;font-family:inherit;color:var(--muted);padding:6px}
.gm-view{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#1b1812;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px}
.gm-page{background:#fff;display:block;flex:none;margin:0 auto}
.gm-msg{margin:auto;text-align:center;color:var(--muted);padding:24px;line-height:1.5}
.gm-card{margin:auto;text-align:center;padding:24px;line-height:1.7;font-size:18px}.gm-big{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,56px);color:var(--gold);line-height:1.1}.gm-bigsub{font-size:24px;margin:6px 0 10px}
.gm-bottom{flex:none;background:#14100a;border-top:2px solid var(--gold);padding:10px 12px calc(env(safe-area-inset-bottom,0px) * .35 + 10px);max-height:40vh;overflow:auto}
.gm-nav{display:flex;gap:10px;align-items:stretch}
.gm-nb{flex:none;width:64px;min-height:64px;border-radius:14px;border:1px solid var(--line);background:rgba(255,191,67,.14);color:var(--gold);font-size:26px;font-weight:800;font-family:inherit}
.gm-nb:disabled{opacity:.3}
.gm-info{flex:1;min-width:0;line-height:1.4}
.gm-lbl{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin-right:6px}
.gm-now{font-size:15px;margin-bottom:4px;color:var(--cream)}
.gm-say{color:var(--gold);font-style:italic;font-size:16px;margin-bottom:4px}
.gm-next{font-size:16px}.gm-bits{color:var(--muted);font-size:14px}
.gm-alert{color:var(--gold);font-size:13px;margin-top:2px}
.gm-notes{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.gm-notes .past{opacity:.4;text-decoration:line-through}.gm-notes .now{color:var(--gold)}
.gm-drawer{position:absolute;inset:0;z-index:5;background:rgba(5,3,0,.97);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.gm-dh{padding:10px 14px 4px;color:var(--gold);font-weight:800;letter-spacing:.06em;font-size:12px}
.gm-di{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);color:var(--cream);padding:14px;font-size:17px;font-family:inherit}
.gm-di .n{color:var(--muted);width:24px}.gm-di .grow{flex:1;min-width:0}.gm-di.on{background:rgba(255,191,67,.14);color:var(--gold)}
.toast{z-index:120}
/* page text size (Settings → Text size; Auto = a bit larger from iPad width up) */
main.view,.modal>*{zoom:var(--tz,1)}
/* ---------- offline (view-only) ---------- */
.offline-bar{flex:none;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px;background:#2a1d05;color:var(--gold);font-size:13px;border-bottom:1px solid var(--line)}
body.offline :is([data-act="gig-edit"],[data-act="sl-edit"],[data-act^="new-"],[data-act="sl-new"],[data-act="song-new"],[data-act="song-edit-mode"],[data-act="set-status"],[data-act^="exp-"],[data-act^="sale-"],[data-act^="merch-"],[data-act="opt-open"],[data-act="set-default"],[data-act="set-clear-ask"],[data-act="sl-dup"],[data-act="sl-del-ask"],[data-act="sl-unassign"],[data-act="rotate-token"],[data-act="save-settings"],[data-act="save-members"],[data-act="song-save"],[data-act="photo-del"],[data-act^="chart-del"],[data-act="chart-use"]),

body.offline :is(.chk,.stars:not(.ro),[data-chart-default],[data-text-size]){pointer-events:none;opacity:.45}
body.offline [data-text-size]{pointer-events:auto;opacity:1}
.gm-dn{padding:2px 14px 12px 50px;color:var(--gold);font-style:italic;font-size:15px;line-height:1.35;border-top:0}
.snote-edit textarea.in{min-height:46px;resize:vertical;font-size:14px;line-height:1.35}
.ptr{position:fixed;left:50%;transform:translateX(-50%);z-index:60;background:var(--gold);color:#140e02;font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none}
main{padding-bottom:72px}

@media (min-width:700px){ .top{padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr,56px))} .tabbar{bottom:-24px;padding-bottom:calc(24px + var(--ftr,14px))} }   /* --ftr = how far the icons sit above the screen edge */
